[build-system]
requires = ["setuptools>=69,<80", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-health-data"
version = "0.1.0+casita.2"
description = "Apollo local health data with an opt-in Casita care specialist, documents and reminders."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [
  { name = "RTK", email = "apollo@ultima.inc" },
]
dependencies = [
  # zoneinfo needs a timezone database; bundle the first-party fallback so local-day
  # bucketing works on hosts without an OS tz database (otherwise it would silently
  # degrade to UTC, reintroducing the off-by-one day for non-UTC users).
  "tzdata>=2024.1",
  "jsonschema>=4.23,<5",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-timeout>=2.3,<3",
]

[project.entry-points."hermes_agent.plugins"]
health-data = "health_data_entry"

[tool.setuptools]
py-modules = [
  "care_store",
  "care_specialist",
  "care_runtime",
  "care_plugin",
  "care_dispatch",
  "care_jobs",
  "care_native",
  "care_documents",
  "care_reminders",
  "care_drive_auth",
  "care_egress",
  "care_extract",
  "care_reports",
  "care_cli",
  "health_data_entry",
  "store",
  "query",
  "food",
  "commands",
  "onboarding",
  "oura",
  "oauth_token",
  "google_health",
  "google_health_auth",
  "normalize",
  "context",
  "sync_control",
  "semantic_layer",
  "feature_registry",
  "feature_engineering",
  "analysis_registry",
  "analysis_tools",
]
packages = ["health_data_assets"]

[tool.setuptools.package-data]
health_data_assets = [
  "plugin.yaml",
  "skills/health-coach/SKILL.md",
  "skills/health-visuals/SKILL.md",
  "skills/health-visuals/references/cli_visual_patterns.md",
  "skills/health-visuals/references/terminal_ascii_patterns.md",
  "skills/health-visuals/references/ansi_visual_patterns.md",
  "skills/health-visuals/references/ansi_color_implementation_plan.md",
  "visuals/cli/README.md",
  "visuals/cli/mockups/*.txt",
  "visuals/cli/prompts/*.md",
]

[tool.pytest.ini_options]
addopts = "-q --timeout=30"
testpaths = ["tests"]
markers = [
  "integration: tests that drive a real Hermes agent or external model",
]
